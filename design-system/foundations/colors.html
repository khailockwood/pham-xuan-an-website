<!-- @dsCard group="Foundations" -->
<link rel="stylesheet" href="../styles/tokens.css" />
<style>
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .sw { border: 1px solid hsl(var(--border)); border-radius: var(--radius); overflow: hidden; }
  .sw .chip { height: 72px; }
  .sw .meta { padding: 8px 10px; background: hsl(var(--paper-2)); }
  .sw .name { font-size: 0.82rem; font-weight: 500; }
  .sw .hex { font-family: var(--font-mono); font-size: 0.7rem; color: hsl(var(--ink-muted)); }
</style>

<div class="eyebrow"><span class="rule"></span><span class="label mono-label">Foundations</span></div>
<h2 class="ds-title">Colour palette</h2>
<p class="ds-sub">White ground with a neutral grey for recessed bands, Dartmouth pine as the primary, gold as the accent.</p>

<div class="swatches">
  <div class="sw"><div class="chip" style="background:hsl(var(--paper))"></div><div class="meta"><div class="name">Paper</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--paper-2))"></div><div class="meta"><div class="name">Paper 2</div><div class="hex">#F3F4F4</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--ink))"></div><div class="meta"><div class="name">Ink</div><div class="hex">#151918</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--pine))"></div><div class="meta"><div class="name">Pine (primary)</div><div class="hex">#00693E</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--pine-deep))"></div><div class="meta"><div class="name">Pine deep</div><div class="hex">#06371F</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--gold))"></div><div class="meta"><div class="name">Gold (accent)</div><div class="hex">#B0852B</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--gold-bright))"></div><div class="meta"><div class="name">Gold bright</div><div class="hex">#C6A24E</div></div></div>
  <div class="sw"><div class="chip" style="background:hsl(var(--border))"></div><div class="meta"><div class="name">Border</div><div class="hex">#D9DDDB</div></div></div>
</div>
